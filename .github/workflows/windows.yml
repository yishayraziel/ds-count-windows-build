name: DS-COUNT Windows x64
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build plug-in, tests and installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Install, validate and uninstall
        shell: pwsh
        run: ./scripts/validate-windows.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DS-COUNT-Windows-x64
          if-no-files-found: error
          path: dist/*.exe
      - name: Upload test and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DS-COUNT-Windows-logs
          path: outputs/**
      - name: Publish release (Windows installer + notarized Mac disk image)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(DSCount VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $tag = "v$version"
          $files = @(Get-ChildItem dist/*.exe) + @(Get-ChildItem release/*.dmg -ErrorAction SilentlyContinue) | ForEach-Object { $_.FullName }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "DS-COUNT $version" --notes "DS-COUNT $version by Yishay Raziel. Mac: notarized disk image (VST3, AU, Standalone). Windows x64: installer (VST3, Standalone). https://yraziel.com/ds-count"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
